server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cabeçalhos de segurança. Atenção: o nginx só herda add_header para um location que NÃO declare nenhum add_header
  # próprio — por isso nenhum location abaixo usa add_header (cache dos .js/.css é feito com `expires`).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=15552000" always;  # só vale quando o acesso é por HTTPS (proxy do Coolify)
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # A API fica atrás do mesmo domínio: o front chama /api/v1/... (sem CORS)
  location /api/ {
    proxy_pass http://api:8000;
    client_max_body_size 10m;  # restauração de backup envia o arquivo inteiro
    proxy_read_timeout 120s;  # a 1ª criação do banco no Appwrite pode demorar
    proxy_hide_header X-Content-Type-Options;  # a API também envia; evita o cabeçalho duplicado
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css)$ { expires -1; }  # Cache-Control: no-cache, sem perder os cabeçalhos de segurança acima
}
